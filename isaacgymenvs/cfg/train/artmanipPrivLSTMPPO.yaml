params:
  seed: ${...seed}

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic_sapg_priv
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: fixed
    mlp:
      units: [512,256,128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True
      layer_norm: True
    sapg_priv:
      policy_obs_dim: ${.....task.env.policyObsDim}
      privileged_obs_dim: ${.....task.env.privilegedObsDim}
      critic_policy_contact_dim: 5
      expl_embedding_dim: 32
      encoder:
        units: [256,128,16]
        activation: elu
        initializer:
          name: default
      student_encoder:
        type: auto
        init_dim: 57
        proprio_encoder:
          units: [128, 64]
          activation: elu
          initializer:
            name: default
        init_encoder:
          units: [128, 64]
          activation: elu
          initializer:
            name: default
        temporal:
          type: tconv
          hidden_size: 192
          num_layers: 5
          kernel_size: 3
          dilation_growth: 2
          activation: elu
          dropout: 0.05
        latent_head:
          units: [128]
          activation: elu
          initializer:
            name: default

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:artmanipPrivLSTMPPO,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: ${resolve_default:50000,${....max_iterations}}
    save_best_after: 50
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 32000
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 16
    bounds_loss_coef: 0.0001

    defer_summaries_sec: ${if:${....pbt.enabled},150,5}
    summaries_interval_sec_min: ${if:${....pbt.enabled},20,5}
    summaries_interval_sec_max: 100
    expl_type: none

    player:
      deterministic: True
      use_vecenv: True
      games_num: 1000000
      print_stats: False
